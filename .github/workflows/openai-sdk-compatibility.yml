name: OpenAI SDK Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 2"

permissions:
  contents: read
  packages: read

jobs:
  sdk-contract:
    name: SDK wire contract / ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ["2.21.0", "2.45.0", "3.10.0", latest-3x-early-warning]
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout live develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'develop' }}
          persist-credentials: false
      - name: Select SDK version for early warning
        run: |
          set -euo pipefail
          if [ "${{ matrix.sdk }}" = "latest-3x-early-warning" ]; then
            # Experimental only; this does not widen the manifest's tested range.
            SPEC='openai>=3.10.0,<4'
          else
            SPEC="openai==${{ matrix.sdk }}"
          fi
          python -m pip install --upgrade "$SPEC"
          python -m pip check
          python -c 'import openai; print("OpenAI SDK under test:", openai.__version__)'
      - name: Run focused real SDK wire contract
        run: |
          python -m pytest -q \
            tests/test_openai_sdk_wire.py \
            tests/test_openai_sdk_malformed_wire.py \
            tests/test_openai_sdk_error_matrix.py \
            tests/test_openai_sdk_catalog_matrix.py \
            tests/test_openai_sdk_multicall_wire.py \
            tests/test_openai_sdk_ha_compatibility.py \
            tests/test_openai_compat.py
