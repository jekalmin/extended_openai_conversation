name: Enhanced nightly acceptance and stress

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign to run
        type: choice
        required: true
        default: all
        options: [all, runtime, lifecycle, ai-task, voice-intercom, archive, feature-crossroads, setup, backup, backup-transfer, persistence, request-rules, guest-security, quiet-hours, functions, provider-resilience, memory-knowledge, large-installation, browser, browser-engines, chaos, process-chaos, diagnostics]
      intensity:
        description: Workload multiplier
        type: choice
        required: true
        default: normal
        options: [normal, heavy]
      seed:
        description: Optional deterministic unsigned integer seed
        type: string
        required: false

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: enhanced-stress-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      seed: ${{ steps.seed.outputs.seed }}
      intensities: ${{ steps.seed.outputs.intensities }}
      campaigns: ${{ steps.seed.outputs.campaigns }}
    steps:
      - name: Resolve reproducible run controls
        id: seed
        env:
          REQUESTED_SEED: ${{ inputs.seed }}
          REQUESTED_INTENSITY: ${{ inputs.intensity }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SEED" ]; then
            [[ "$REQUESTED_SEED" =~ ^[0-9]+$ ]] || { echo 'Seed must be an unsigned integer' >&2; exit 1; }
            SEED="$REQUESTED_SEED"
          else
            SEED="$(python3 -c 'import secrets; print(secrets.randbits(32))')"
          fi
          INTENSITY="${REQUESTED_INTENSITY:-normal}"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == schedule || "$INTENSITY" == all ]]; then
            echo 'intensities=["normal","heavy"]' >> "$GITHUB_OUTPUT"
          else
            echo "intensities=[\"$INTENSITY\"]" >> "$GITHUB_OUTPUT"
          fi
          case "${{ inputs.campaign }}" in
            '') CAMPAIGNS='["runtime","lifecycle","ai-task","voice-intercom","archive","feature-crossroads","setup","backup","backup-transfer","persistence","request-rules","guest-security","quiet-hours","functions","provider-resilience","memory-knowledge","large-installation","chaos","process-chaos"]' ;;
            all|browser) CAMPAIGNS='["runtime","lifecycle","ai-task","voice-intercom","archive","feature-crossroads","setup","backup","backup-transfer","persistence","request-rules","guest-security","quiet-hours","functions","provider-resilience","memory-knowledge","large-installation","chaos","process-chaos"]' ;;
            browser-engines) CAMPAIGNS='[]' ;;
            runtime|lifecycle|ai-task|voice-intercom|archive|feature-crossroads|setup|backup|backup-transfer|persistence|request-rules|guest-security|quiet-hours|functions|provider-resilience|memory-knowledge|large-installation|chaos|process-chaos|diagnostics) CAMPAIGNS="[\"${{ inputs.campaign }}\"]" ;;
            *) echo 'Unknown campaign' >&2; exit 1 ;;
          esac
          echo "campaigns=$CAMPAIGNS" >> "$GITHUB_OUTPUT"
          echo "ENHANCED STRESS SEED=$SEED INTENSITY=$INTENSITY"
          {
            echo '## Enhanced acceptance run'
            echo
            echo "Seed: \`$SEED\` · Intensity: \`$INTENSITY\`"
            echo
            echo 'Reproduce with workflow_dispatch and the same campaign, intensity, and seed.'
          } >> "$GITHUB_STEP_SUMMARY"

  python-campaigns:
    name: ${{ matrix.campaign }} / ${{ matrix.intensity }}
    needs: prepare
    if: github.event_name == 'schedule' || (inputs.campaign != 'browser' && inputs.campaign != 'browser-engines')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(needs.prepare.outputs.campaigns) }}
        intensity: ${{ fromJSON(needs.prepare.outputs.intensities) }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_INTENSITY: ${{ matrix.intensity }}
      STRESS_CAMPAIGN: ${{ matrix.campaign }}
      STRESS_ARTIFACT_DIR: stress-artifacts
    steps:
      - name: Checkout candidate or nightly develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Reconcile current test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" != "$BUILT_ENVIRONMENT_SHA" ]; then
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi
      - name: Stage published payload for downgrade boundary
        if: matrix.campaign == 'persistence'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          OLD_ROOT="${RUNNER_TEMP}/eoai-downgrade-release"
          mkdir -p "$OLD_ROOT"
          git archive "$TAG" custom_components/extended_openai_conversation_responses | tar -x -C "$OLD_ROOT"
          echo "DOWNGRADE_COMPONENT_DIR=$OLD_ROOT/custom_components/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          CANDIDATE_COMPONENT="$GITHUB_WORKSPACE/custom_components/extended_openai_conversation_responses"
          CANDIDATE_VERSION="$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')"
          echo "EOAI_SOURCE_VERSION=$TAG" >> "$GITHUB_ENV"
          echo "UPGRADE_FROM_COMPONENT_DIR=$OLD_ROOT/custom_components/extended_openai_conversation_responses" >> "$GITHUB_ENV"
          echo "UPGRADE_TO_COMPONENT_DIR=$CANDIDATE_COMPONENT" >> "$GITHUB_ENV"
          echo "UPGRADE_FROM_VERSION=$TAG" >> "$GITHUB_ENV"
          echo "UPGRADE_TO_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Downgrade/upgrade source payload: $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Upgrade candidate payload: $CANDIDATE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage candidate payload for clean-install acceptance
        if: matrix.campaign == 'setup'
        run: |
          set -euo pipefail
          CANDIDATE_COMPONENT="$GITHUB_WORKSPACE/custom_components/extended_openai_conversation_responses"
          CANDIDATE_VERSION="$(python -c 'import json; print(json.load(open("custom_components/extended_openai_conversation_responses/manifest.json"))["version"])')"
          echo "RELEASE_COMPONENT_DIR=$CANDIDATE_COMPONENT" >> "$GITHUB_ENV"
          echo "RELEASE_EXPECTED_VERSION=$CANDIDATE_VERSION" >> "$GITHUB_ENV"
          echo "Clean-install candidate payload: $CANDIDATE_VERSION" >> "$GITHUB_STEP_SUMMARY"
      - name: Run enhanced campaign
        id: campaign_run
        run: |
          case "$STRESS_CAMPAIGN" in
            runtime) TEST_PATHS=(tests_stress/test_runtime_soak.py tests_stress/test_conversation_id_collision.py tests_stress/test_evidence_manifest.py tests_stress/test_frontend_route_inventory.py tests_stress/test_management_action_inventory.py tests_stress/test_public_service_inventory.py tests_stress/test_backup_inventory.py tests_stress/test_nightly_inventory.py tests_real_ha/test_runtime_recovery_journey.py) ;;
            lifecycle) TEST_PATHS=(tests_stress/test_lifecycle_matrix.py tests_stress/test_installed_lifecycle.py tests_stress/test_active_unload_races.py tests_stress/test_active_removal_races.py tests_stress/test_management_replay_safety.py tests_stress/test_complete_user_journeys.py tests_real_ha/test_multi_entry_lifecycle.py tests_real_ha/test_config_flow_lifecycle_contracts.py tests_real_ha/test_partial_platform_setup_retry.py) ;;
            ai-task) TEST_PATHS=(tests_stress/test_ai_task_mixed_campaign.py tests_real_ha/test_ai_task_runtime.py tests_real_ha/test_ai_task_lifecycle.py tests_real_ha/test_ai_task_provider_wire.py) ;;
            voice-intercom) TEST_PATHS=(tests_stress/test_voice_household_campaign.py tests_stress/test_intercom_endurance_campaign.py tests_real_ha/test_assist_voice_identity_precedence.py tests_real_ha/test_intercom_voice_acceptance.py) ;;
            archive) TEST_PATHS=(tests_stress/test_archive_living_campaign.py tests/test_conversation_archive.py) ;;
            feature-crossroads) TEST_PATHS=(tests_stress/test_skill_lifecycle_campaign.py tests_stress/test_local_intent_mixed_campaign.py tests_stress/test_streaming_speech_endurance.py tests_stress/test_usage_retention_endurance.py tests_stress/test_model_catalog_refresh_endurance.py tests_stress/test_exposure_churn_endurance.py tests_stress/test_generated_valid_transitions.py tests_stress/test_valid_configuration_transitions.py tests_stress/test_evidence_manifest.py tests_real_ha/test_local_intent_exclusions.py tests_real_ha/test_assist_streaming_speech_processing.py tests_real_ha/test_usage_accounting_failure_recovery.py tests_real_ha/test_model_catalog_live_refresh.py tests_real_ha/test_entity_attribute_runtime_integrity.py tests_real_ha/test_entity_registry_customization.py tests/test_skill_availability.py tests/test_skill_filesystem_concurrency.py tests/test_usage_accounting_recovery.py tests/test_model_catalog_transitions.py) ;;
            setup) TEST_PATHS=(tests_stress/test_backup_inventory.py tests_stress/test_reauth_active_traffic.py tests_real_ha/test_config_flow.py tests_real_ha/test_config_flow_edges.py tests_real_ha/test_config_flow_lifecycle_contracts.py tests_real_ha/test_packaged_release.py) ;;
            backup) TEST_PATHS=(tests_stress/test_backup_fault_matrix.py tests_stress/test_backup_live_overlap.py tests_stress/test_backup_inventory.py tests_stress/test_historical_backup.py) ;;
            backup-transfer) TEST_PATHS=(tests_stress/test_backup_transfer.py tests_stress/test_backup_transfer_preview_races.py) ;;
            persistence) TEST_PATHS=(tests_stress/test_persistence_forward_and_clock.py tests_stress/test_management_transaction_matrix.py tests_stress/test_published_downgrade_boundary.py tests_stress/test_backup_fault_matrix.py tests_stress/test_store_structure_recovery.py tests_stress/test_os_storage_faults.py tests_real_ha/test_corrupt_subsystem_store_startup_isolation.py tests_real_ha/test_pending_store_write_shutdown_recovery.py tests_real_ha/test_persistent_memory_shutdown_recovery.py tests_real_ha/test_store_write_process_crash.py tests_real_ha/test_delayed_tool_process_restart.py tests_real_ha/test_release_upgrade_acceptance.py) ;;
            request-rules) TEST_PATHS=(tests_stress/test_request_rules_matrix.py tests_stress/test_request_rules_provider_wire.py tests_real_ha/test_request_rules_script_semantics.py) ;;
            guest-security) TEST_PATHS=(tests_stress/test_guest_functions_matrix.py tests_stress/test_guest_provider_wire.py tests_real_ha/test_security_routing_boundaries.py tests_real_ha/test_management_authorization_matrix.py) ;;
            quiet-hours) TEST_PATHS=(tests_stress/test_quiet_hours_multi_satellite.py tests_stress/test_quiet_hours_ownership_time.py tests_real_ha/test_quiet_hours_resilience.py tests_real_ha/test_quiet_hours_scheduling.py) ;;
            functions) TEST_PATHS=(tests_stress/test_function_groups_state_machine.py tests_stress/test_function_provider_wire.py tests_stress/test_function_provider_wire_remaining.py tests_stress/test_delayed_mutation_matrix.py tests_stress/test_active_ha_request_mutations.py tests_real_ha/test_provider_wire_e2e.py tests_real_ha/test_native_service_disappearance.py tests_real_ha/test_native_recorder_acceptance.py tests_real_ha/test_native_automation_acceptance.py tests_real_ha/test_delayed_tool_due_reauthorization.py tests_real_ha/test_live_config_mutation_semantics.py tests_real_ha/test_target_registry_mutation_race.py tests/functions tests/test_function_execution_coverage.py) ;;
            provider-resilience) TEST_PATHS=(tests_stress/test_provider_fault_matrix.py tests_stress/test_provider_fault_phases.py tests_stress/test_provider_event_sequences.py tests_stress/test_provider_dependency_degradation.py tests_stress/test_cancellation_resource_lifetime.py tests_stress/test_provider_valid_chunking.py tests_stress/test_provider_concurrent_backpressure.py tests_stress/test_active_provider_stream_cancellation.py tests_stress/test_provider_real_connection_pool.py tests_real_ha/test_provider_failure_recovery.py tests_real_ha/test_provider_wire_truncated_tool_stream.py tests_real_ha/test_cancel_after_side_effect.py tests_real_ha/test_usage_accounting_failure_recovery.py tests_real_ha/test_degraded_diagnostics.py tests/test_openai_sdk_wire.py tests/test_openai_sdk_malformed_wire.py tests/test_openai_sdk_error_matrix.py tests/test_openai_sdk_catalog_matrix.py tests/test_openai_sdk_multicall_wire.py) ;;
            memory-knowledge) TEST_PATHS=(tests_stress/test_memory_knowledge_scale.py tests_stress/test_temporary_memory_scale.py tests_stress/test_provider_wire_privacy.py) ;;
            large-installation) TEST_PATHS=(tests_stress/test_large_installation.py tests_stress/test_extreme_context_matrix.py tests_stress/test_memory_knowledge_scale.py tests_stress/test_provider_wire_privacy.py tests_stress/test_archive_living_campaign.py tests_stress/test_generated_valid_states.py tests_stress/test_generated_state_lifecycle.py) ;;
            chaos) TEST_PATHS=(tests_stress/test_cross_feature_chaos.py) ;;
            process-chaos) TEST_PATHS=(tests_stress/test_backup_inventory.py tests_real_ha/test_immediate_tool_process_crash.py tests_real_ha/test_store_write_process_crash.py tests_real_ha/test_restore_transaction_process_crash.py tests_real_ha/test_delayed_tool_process_restart.py tests_real_ha/test_active_request_shutdown_recovery.py) ;;
            diagnostics) TEST_PATHS=(tests_stress/test_diagnostics_failure_probe.py) ;;
            *) exit 2 ;;
          esac
          set +e
          pytest "${TEST_PATHS[@]}" -v -s --asyncio-mode=auto --log-cli-level=WARNING \
            --timeout=600 --durations=20 \
            --stress-seed="$STRESS_SEED" --stress-intensity="$STRESS_INTENSITY" \
            --show-capture=no --tb=short > enhanced-raw.log 2>&1
          RESULT=$?
          python ci/enhanced_evidence.py sanitize-log enhanced-raw.log stress-artifacts/pytest.log
          rm enhanced-raw.log
          cat stress-artifacts/pytest.log
          if [ "$STRESS_CAMPAIGN" = diagnostics ]; then
            test "$RESULT" -ne 0
            python ci/verify_enhanced_failure.py stress-artifacts stress-artifacts/pytest.log
          else
            exit "$RESULT"
          fi
      - name: Summarize exercised operations
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload campaign evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.campaign }}-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: browser / ${{ matrix.intensity }}
    needs: prepare
    if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'browser' || inputs.campaign == 'diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        intensity: ${{ fromJSON(needs.prepare.outputs.intensities) }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:browser-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_INTENSITY: ${{ matrix.intensity }}
      STRESS_CAMPAIGN: ${{ inputs.campaign == 'diagnostics' && 'browser-diagnostics' || 'browser' }}
      STRESS_ARTIFACT_DIR: stress-artifacts
    steps:
      - name: Checkout candidate or nightly develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Stage the latest published frontend for stale-asset acceptance
        if: inputs.campaign != 'diagnostics'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          TAG="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/${{ github.repository }}/releases/latest" | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          OLD_ROOT="${RUNNER_TEMP}/eoai-published-frontend"
          mkdir -p "$OLD_ROOT"
          git archive "$TAG" custom_components/extended_openai_conversation_responses/frontend | tar -x -C "$OLD_ROOT"
          echo "EOAI_OLD_FRONTEND_DIR=$OLD_ROOT/custom_components/extended_openai_conversation_responses/frontend" >> "$GITHUB_ENV"
          echo "EOAI_SOURCE_VERSION=$TAG" >> "$GITHUB_ENV"
          echo "Published frontend baseline: $TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Install local Playwright runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
      - name: Reconcile current Home Assistant requirements
        if: inputs.campaign != 'diagnostics'
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" != "$BUILT_ENVIRONMENT_SHA" ]; then
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi
      - name: Run long-lived browser campaign
        if: inputs.campaign != 'diagnostics'
        run: |
          set +e
          npx playwright test --config=playwright.stress.config.mjs > browser-raw.log 2>&1
          RESULT=$?
          python ci/enhanced_evidence.py sanitize-log browser-raw.log stress-artifacts/browser.log
          rm browser-raw.log
          cat stress-artifacts/browser.log
          exit "$RESULT"
      - name: Recheck gated stale responses and listener ownership
        if: inputs.campaign != 'diagnostics'
        run: >-
          python ci/run_sanitized.py stress-artifacts/browser-recheck.log --
          npx playwright test --config=playwright.config.mjs
          tests_browser/retained-mutation-state.spec.mjs
          tests_browser/backend-reconnect.spec.mjs
          tests_browser/management-lazy-ownership.spec.mjs
      - name: Run two tabs against one genuine HA backend
        if: inputs.campaign != 'diagnostics'
        run: >-
          python ci/run_sanitized.py stress-artifacts/browser-real-ha-tabs.log --
          pytest tests_stress/test_browser_multi_tab.py -v -s
          --asyncio-mode=auto --timeout=240
          --stress-seed="$STRESS_SEED" --stress-intensity="$STRESS_INTENSITY"
      - name: Run browser actions through genuine HA WebSocket schemas
        if: inputs.campaign != 'diagnostics'
        env:
          RUN_REAL_HA_BROWSER: "1"
          RUN_ENHANCED_MANAGEMENT_CONTRACT: "1"
        run: >-
          python ci/run_sanitized.py stress-artifacts/browser-real-ha-ws.log --
          pytest
          tests_stress/test_management_ws_contract.py
          tests_real_ha/test_browser_backend_acceptance.py::test_shipped_browser_frontend_talks_to_real_management_websocket
          tests_stress/test_browser_management_contract.py
          tests_stress/test_browser_backend_resilience.py
          -v -s --asyncio-mode=auto --timeout=600 --log-cli-level=WARNING
      - name: Verify controlled Playwright failure artifacts
        if: inputs.campaign == 'diagnostics'
        run: |
          set +e
          npx playwright test tests_browser/nightly-diagnostics-probe.mjs --config=playwright.diagnostics.config.mjs > browser-raw.log 2>&1
          RESULT=$?
          python ci/enhanced_evidence.py sanitize-log browser-raw.log stress-artifacts/browser.log
          rm browser-raw.log
          cat stress-artifacts/browser.log
          test "$RESULT" -ne 0
          python ci/verify_browser_failure.py test-results
      - name: Summarize exercised transitions
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-browser-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure diagnostics
        if: failure() || inputs.campaign == 'diagnostics'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-browser-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  browser-engines:
    name: browser-${{ matrix.engine }} / ${{ matrix.intensity }}
    needs: prepare
    if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'browser' || inputs.campaign == 'browser-engines'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
        intensity: ${{ fromJSON(needs.prepare.outputs.intensities) }}
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: ${{ github.workspace }}
      CROSS_BROWSER_ENGINE: ${{ matrix.engine }}
      CROSS_BROWSER_NIGHTLY: "1"
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_INTENSITY: ${{ matrix.intensity }}
      STRESS_CAMPAIGN: browser-${{ matrix.engine }}
      STRESS_ARTIFACT_DIR: stress-artifacts
    steps:
      - name: Checkout candidate or nightly develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - name: Install local runner and engine
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0
          npx playwright install --with-deps "$CROSS_BROWSER_ENGINE"
      - name: Install Home Assistant acceptance requirements
        run: |
          pip install -r requirements_test.txt
          pip install --upgrade homeassistant
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          pip check
      - name: Run curated engine and keyboard journeys
        run: >-
          python ci/run_sanitized.py stress-artifacts/browser-engine.log --
          npx playwright test --config=playwright.cross-browser-nightly.config.mjs
      - name: Run same-object conflicts through genuine HA
        run: >-
          python ci/run_sanitized.py stress-artifacts/browser-real-ha-tabs.log --
          pytest tests_stress/test_browser_multi_tab.py -v -s
          --asyncio-mode=auto --timeout=600
          --stress-seed="$STRESS_SEED" --stress-intensity="$STRESS_INTENSITY"
      - name: Summarize engine evidence
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload engine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-browser-${{ matrix.engine }}-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload engine failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-browser-${{ matrix.engine }}-${{ matrix.intensity }}-seed-${{ needs.prepare.outputs.seed }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  ha-lifecycle-matrix:
    name: HA ${{ matrix.ha-version }} / shared lifecycle contract
    needs: prepare
    if: github.event_name == 'schedule' || inputs.campaign == 'all' || inputs.campaign == 'lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STRESS_CAMPAIGN: lifecycle-matrix
      STRESS_INTENSITY: normal
      STRESS_SEED: ${{ needs.prepare.outputs.seed }}
      STRESS_ARTIFACT_DIR: stress-artifacts
      HA_POINT: ${{ matrix.ha-version }}
    strategy:
      fail-fast: false
      matrix:
        ha-version: [oldest, stable, dev]
    steps:
      - name: Checkout candidate or nightly develop
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Resolve Python version required by HA dev
        id: python
        run: |
          if [[ '${{ matrix.ha-version }}' == dev ]]; then
            SHA="$(git ls-remote https://github.com/home-assistant/core.git refs/heads/dev | awk '{print $1}')"
            test -n "$SHA"
            VERSION="$(curl -fsSL "https://raw.githubusercontent.com/home-assistant/core/$SHA/.python-version" | tr -d '\n')"
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            VERSION=3.14
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          allow-prereleases: true
      - name: Install test and selected HA environment
        env:
          HA_POINT: ${{ matrix.ha-version }}
          HA_DEV_SHA: ${{ steps.python.outputs.sha }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          if [[ "$HA_POINT" == oldest ]]; then
            MINIMUM="$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
            # The newest fixture plugin calls Core APIs added after this floor.
            # 0.13.317 is the earliest published plugin for the 2026.3 series.
            python -m pip install 'pytest-homeassistant-custom-component==0.13.317'
            # The plugin was published for 2026.3.1; restore EOAI's exact beta
            # floor after its test-only dependencies have been resolved.
            python -m pip install --pre "homeassistant==$MINIMUM"
          elif [[ "$HA_POINT" == stable ]]; then
            python -m pip install --upgrade homeassistant
          else
            python -m pip install "git+https://github.com/home-assistant/core.git@$HA_DEV_SHA"
          fi
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          python -c 'from importlib.metadata import version; print("homeassistant=" + version("homeassistant"))'
      - name: Run the same genuine HA lifecycle contract
        env:
          PYTHONPATH: ${{ github.workspace }}
          STRESS_SEED: ${{ needs.prepare.outputs.seed }}
          STRESS_ARTIFACT_DIR: stress-artifacts
        run: |
          set +e
          pytest tests_stress/test_lifecycle_matrix.py tests_real_ha/test_public_version_journeys.py \
            -v -s --asyncio-mode=auto --timeout=600 \
            --stress-seed="$STRESS_SEED" --stress-intensity=normal \
            --show-capture=no --tb=short > enhanced-raw.log 2>&1
          RESULT=$?
          python ci/enhanced_evidence.py sanitize-log enhanced-raw.log stress-artifacts/pytest.log
          rm enhanced-raw.log
          cat stress-artifacts/pytest.log
          exit "$RESULT"
      - name: Summarize lifecycle contract
        if: always()
        env:
          ENHANCED_JOB_STATUS: ${{ job.status }}
        run: |
          python ci/enhanced_evidence.py sanitize-dir stress-artifacts
          python ci/enhanced_summary.py stress-artifacts
      - name: Upload lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-lifecycle-${{ matrix.ha-version }}-seed-${{ needs.prepare.outputs.seed }}
          path: stress-artifacts/
          if-no-files-found: warn
          retention-days: 14

  certify:
    name: Consolidated nightly certification
    needs: [prepare, python-campaigns, browser, browser-engines, ha-lifecycle-matrix]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact run source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      - name: Download campaign evidence
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-*
          path: enhanced-evidence
      - name: Download controlled browser failure artifacts
        if: inputs.campaign == 'diagnostics'
        uses: actions/download-artifact@v4
        with:
          pattern: diagnostics-browser-*
          path: browser-failure-evidence
      - name: Verify uploaded failure artifacts and private canaries
        if: inputs.campaign == 'diagnostics'
        run: |
          python ci/verify_enhanced_failure.py \
            enhanced-evidence/evidence-diagnostics-${{ inputs.intensity }}-seed-${{ needs.prepare.outputs.seed }} \
            enhanced-evidence/evidence-diagnostics-${{ inputs.intensity }}-seed-${{ needs.prepare.outputs.seed }}/pytest.log
          python ci/verify_browser_failure.py browser-failure-evidence
      - name: Consolidate actual job results
        env:
          GH_TOKEN: ${{ github.token }}
          ENHANCED_CAMPAIGNS: ${{ needs.prepare.outputs.campaigns }}
          ENHANCED_INTENSITIES: ${{ needs.prepare.outputs.intensities }}
          ENHANCED_SELECTED: ${{ inputs.campaign || 'all' }}
          ENHANCED_NEEDS: ${{ toJSON(needs) }}
          STRESS_SEED: ${{ needs.prepare.outputs.seed }}
        run: python ci/enhanced_certification.py enhanced-evidence
      - name: Upload certification index
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: certification-index-${{ needs.prepare.outputs.seed }}
          path: certification-final.json
          if-no-files-found: warn
          retention-days: 14
