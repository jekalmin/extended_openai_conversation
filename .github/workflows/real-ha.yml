name: Real HA Acceptance

on:
  pull_request:
    paths:
      - "custom_components/extended_openai_conversation_responses/**"
      - "tests_real_ha/**"
      - "requirements_test.txt"
      - "pyproject.toml"
      - "ci/**"
      - ".github/workflows/real-ha.yml"
  push:
    branches:
      - develop
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  classify:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      process_restart_a: ${{ steps.changes.outputs.process_restart_a }}
      process_restart_b: ${{ steps.changes.outputs.process_restart_b }}
      process_restart_c: ${{ steps.changes.outputs.process_restart_c }}
      shards: ${{ steps.changes.outputs.shards }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # Pushes, schedules, and manual runs deliberately keep full coverage.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            for shard in a b c; do echo "process_restart_${shard}=true" >> "$GITHUB_OUTPUT"; done
            echo 'shards=["parallel-safe","stateful-serial","process-restart-a","process-restart-b-active-request","process-restart-b-immediate-tool","process-restart-c-before-commit","process-restart-c-after-commit"]' >> "$GITHUB_OUTPUT"
            echo "Non-PR event: running the full suite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

          backend=false
          seen=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            seen=true
            case "$path" in
              frontend/*|custom_components/extended_openai_conversation_responses/frontend/*|tests/*.test.mjs|tests_browser/*|playwright*.config.mjs)
                ;;
              *)
                # Fail safe: mixed, backend, dependency, workflow, or unknown
                # changes keep the complete Python/HA checks.
                backend=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          # An unexpected empty diff should never suppress validation.
          if [ "$seen" != "true" ]; then
            backend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          python ci/classify_real_ha_specialists.py \
            "$RUNNER_TEMP/changed-files.txt" --output "$GITHUB_OUTPUT"
          {
            echo "### PR path classification"
            echo
            echo "Backend/HA checks required: `$backend`"
            echo
            echo "Changed files:"
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/changed-files.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Resolve HA Python version
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    outputs:
      python-version: ${{ steps.versions.outputs.python-version }}
      ha-core-sha: ${{ steps.versions.outputs.ha-core-sha }}
    steps:
      - name: Resolve Home Assistant Core dev snapshot
        id: versions
        run: |
          HA_CORE_SHA="$(git ls-remote "https://github.com/${{ env.HA_CORE_REPO }}.git" "refs/heads/${{ env.HA_CORE_BRANCH }}" | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          PYTHON_VERSION="$(curl -fsSL "https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/.python-version" | tr -d '\n')"
          test -n "$PYTHON_VERSION"
          echo "ha-core-sha=$HA_CORE_SHA" >> "$GITHUB_OUTPUT"
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "Home Assistant Core dev commit: $HA_CORE_SHA"
          echo "Home Assistant Python version: $PYTHON_VERSION"

  public-journeys:
    name: Public journeys (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    needs: [classify, prepare]
    if: needs.classify.outputs.backend == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        ha-version: [oldest, stable, dev]
    steps:
      - name: Checkout exact EOAI PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python required by selected HA
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.ha-version == 'dev' && needs.prepare.outputs.python-version || '3.14' }}
          allow-prereleases: true
      - name: Install selected Home Assistant and test dependencies
        env:
          HA_POINT: ${{ matrix.ha-version }}
          HA_DEV_SHA: ${{ needs.prepare.outputs.ha-core-sha }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt
          if [[ "$HA_POINT" == oldest ]]; then
            MINIMUM="$(python -c 'import json; print(json.load(open("hacs.json"))["homeassistant"])')"
            python -m pip install 'pytest-homeassistant-custom-component==0.13.317'
            python -m pip install --pre "homeassistant==$MINIMUM"
          elif [[ "$HA_POINT" == stable ]]; then
            python -m pip install --upgrade homeassistant
          else
            python -m pip install "git+https://github.com/home-assistant/core.git@$HA_DEV_SHA"
          fi
          python ci/install_ha_dependencies.py --manifest custom_components/extended_openai_conversation_responses/manifest.json
          # The HA fixture package pins the current stable Core and SQLAlchemy.
          # The oldest and dev points intentionally replace those pins, as in
          # Enhanced nightly's existing HA lifecycle matrix.
          if [[ "$HA_POINT" == stable ]]; then python -m pip check; fi
      - name: Report exact compatibility points
        env:
          HA_POINT: ${{ matrix.ha-version }}
        run: |
          echo "EOAI_SHA=$(git rev-parse HEAD)"
          python -c 'from importlib.metadata import version; print("HA_POINT=" + __import__("os").environ["HA_POINT"] + " HA_VERSION=" + version("homeassistant"))'
      - name: Run compact public journey contract
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest tests_real_ha/test_public_version_journeys.py -v --asyncio-mode=auto --timeout=600 --tb=short

  stable:
    name: Genuine Home Assistant lifecycle (stable / ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.classify.outputs.shards) }}
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconcile current test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py \
              --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Verify stable test environment
        run: |
          pip check
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY

      - name: Verify stable shard partition
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded = {
              # Browser-only acceptance is owned by the dedicated Frontend
              # Browser -> genuine HA job where RUN_REAL_HA_BROWSER is enabled.
              "test_browser_backend_acceptance.py",
              "test_browser_process_restart_acceptance.py",
              "test_browser_refresh_boundary_acceptance.py",
              "test_browser_runtime_acceptance.py",
              "test_browser_release_upgrade_acceptance.py",
              # Release/package journeys are owned by their specialized workflows.
              "test_release_upgrade_acceptance.py",
              "test_release_upgrade_custom_function_tool.py",
              "test_packaged_release.py",
              "test_packaged_process_restart.py",
          }
          process_restart_a = {
              "test_delayed_tool_process_restart.py",
          }
          process_restart_b = {
              "test_active_request_shutdown_recovery.py",
              "test_immediate_tool_process_crash.py",
          }
          process_restart_c = {
              "test_pending_store_write_shutdown_recovery.py",
          }
          stateful_serial = {
              "test_backup_restore_atomicity.py",
              "test_backup_restore_delayed_tool_collision.py",
              "test_backup_restore_live_runtime_refresh.py",
              "test_cancel_after_side_effect.py",
              "test_concurrent_multi_entry_lifecycle.py",
              "test_config_update_inflight_request.py",
              "test_corrupt_subsystem_store_startup_isolation.py",
              "test_cross_entry_inflight_lifecycle.py",
              "test_delayed_tool_due_reauthorization.py",
              "test_inflight_subentry_removal.py",
              "test_lifecycle_concurrency.py",
              "test_live_config_mutation_semantics.py",
              "test_live_subentry_removal.py",
              "test_multi_entry_lifecycle.py",
              "test_persisted_startup_migration.py",
              "test_persistence_state_round_trips.py",
              "test_provider_failure_recovery.py",
              "test_provider_wire_truncated_tool_stream.py",
              "test_runtime_recovery_journey.py",
              "test_runtime_stress.py",
              "test_store_write_process_crash.py",
              "test_persistent_memory_shutdown_recovery.py",
              "test_same_title_subentry_recreation.py",
              "test_shared_conversation_and_entry_removal.py",
              "test_shared_service_lifecycle.py",
              "test_sibling_subentry_inflight_reload.py",
              "test_target_registry_mutation_race.py",
              "test_temporary_memory_lifecycle.py",
              "test_temporary_memory_unload_reload.py",
              "test_usage_accounting_failure_recovery.py",
          }

          discovered = {
              path.name
              for path in Path("tests_real_ha").glob("test_*.py")
          }
          generic = discovered - excluded
          process_restart = process_restart_a | process_restart_b | process_restart_c
          serial = process_restart | stateful_serial

          unknown = serial - generic
          if unknown:
              raise SystemExit(
                  "Stable shard lists missing/non-generic files: "
                  + ", ".join(sorted(unknown))
              )
          overlaps = {
              "process A/process B": process_restart_a & process_restart_b,
              "process A/process C": process_restart_a & process_restart_c,
              "process B/process C": process_restart_b & process_restart_c,
              "process/stateful": process_restart & stateful_serial,
          }
          bad_overlap = {
              label: values for label, values in overlaps.items() if values
          }
          if bad_overlap:
              raise SystemExit(
                  "Stable serial shards overlap: "
                  + "; ".join(
                      f"{label}={sorted(values)}"
                      for label, values in sorted(bad_overlap.items())
                  )
              )

          parallel_safe = generic - serial
          assigned = parallel_safe | process_restart | stateful_serial
          if assigned != generic:
              missing = generic - assigned
              extra = assigned - generic
              raise SystemExit(
                  f"Stable shard partition mismatch; missing={sorted(missing)}, "
                  f"extra={sorted(extra)}"
              )

          print(f"parallel-safe files: {len(parallel_safe)}")
          print(f"process-restart-a files: {len(process_restart_a)}")
          print(f"process-restart-b files: {len(process_restart_b)}")
          print(f"process-restart-c files: {len(process_restart_c)}")
          print(f"stateful-serial files: {len(stateful_serial)}")
          print(f"excluded specialized files: {len(excluded)}")
          PY

      - name: Run genuine Home Assistant acceptance tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -o pipefail

          PROCESS_RESTART_A=(
            tests_real_ha/test_delayed_tool_process_restart.py
          )
          PROCESS_RESTART_B=(
            tests_real_ha/test_active_request_shutdown_recovery.py
            tests_real_ha/test_immediate_tool_process_crash.py
          )
          PROCESS_RESTART_C=(
            tests_real_ha/test_pending_store_write_shutdown_recovery.py
          )
          STATEFUL_SERIAL=(
            tests_real_ha/test_backup_restore_atomicity.py
            tests_real_ha/test_backup_restore_delayed_tool_collision.py
            tests_real_ha/test_backup_restore_live_runtime_refresh.py
            tests_real_ha/test_cancel_after_side_effect.py
            tests_real_ha/test_concurrent_multi_entry_lifecycle.py
            tests_real_ha/test_config_update_inflight_request.py
            tests_real_ha/test_corrupt_subsystem_store_startup_isolation.py
            tests_real_ha/test_cross_entry_inflight_lifecycle.py
            tests_real_ha/test_delayed_tool_due_reauthorization.py
            tests_real_ha/test_inflight_subentry_removal.py
            tests_real_ha/test_lifecycle_concurrency.py
            tests_real_ha/test_live_config_mutation_semantics.py
            tests_real_ha/test_live_subentry_removal.py
            tests_real_ha/test_multi_entry_lifecycle.py
            tests_real_ha/test_persisted_startup_migration.py
            tests_real_ha/test_persistence_state_round_trips.py
            tests_real_ha/test_provider_failure_recovery.py
            tests_real_ha/test_provider_wire_truncated_tool_stream.py
            tests_real_ha/test_runtime_recovery_journey.py
            tests_real_ha/test_runtime_stress.py
            tests_real_ha/test_store_write_process_crash.py
            tests_real_ha/test_persistent_memory_shutdown_recovery.py
            tests_real_ha/test_same_title_subentry_recreation.py
            tests_real_ha/test_shared_conversation_and_entry_removal.py
            tests_real_ha/test_shared_service_lifecycle.py
            tests_real_ha/test_sibling_subentry_inflight_reload.py
            tests_real_ha/test_target_registry_mutation_race.py
            tests_real_ha/test_temporary_memory_lifecycle.py
            tests_real_ha/test_temporary_memory_unload_reload.py
            tests_real_ha/test_usage_accounting_failure_recovery.py
          )

          XDIST_ARGS=()

          case "${{ matrix.shard }}" in
            process-restart-a)
              TEST_PATHS=("${PROCESS_RESTART_A[@]}")
              COVERAGE_ARGS=()
              ;;
            process-restart-b-active-request)
              TEST_PATHS=(tests_real_ha/test_active_request_shutdown_recovery.py)
              COVERAGE_ARGS=()
              ;;
            process-restart-b-immediate-tool)
              TEST_PATHS=(tests_real_ha/test_immediate_tool_process_crash.py)
              COVERAGE_ARGS=()
              ;;
            process-restart-c-before-commit)
              TEST_PATHS=('tests_real_ha/test_pending_store_write_shutdown_recovery.py::test_shutdown_during_pending_store_write_recovers_complete_generation[before_commit]')
              COVERAGE_ARGS=()
              ;;
            process-restart-c-after-commit)
              TEST_PATHS=('tests_real_ha/test_pending_store_write_shutdown_recovery.py::test_shutdown_during_pending_store_write_recovers_complete_generation[after_commit]')
              COVERAGE_ARGS=()
              ;;
            stateful-serial)
              TEST_PATHS=("${STATEFUL_SERIAL[@]}")
              COVERAGE_ARGS=()
              ;;
            parallel-safe)
              TEST_PATHS=(tests_real_ha/)
              TEST_PATHS+=(
                --ignore=tests_real_ha/test_browser_backend_acceptance.py
                --ignore=tests_real_ha/test_browser_process_restart_acceptance.py
                --ignore=tests_real_ha/test_browser_refresh_boundary_acceptance.py
                --ignore=tests_real_ha/test_browser_runtime_acceptance.py
                --ignore=tests_real_ha/test_browser_release_upgrade_acceptance.py
                --ignore=tests_real_ha/test_release_upgrade_acceptance.py
                --ignore=tests_real_ha/test_release_upgrade_custom_function_tool.py
                --ignore=tests_real_ha/test_packaged_release.py
                --ignore=tests_real_ha/test_packaged_process_restart.py
              )
              for path in "${PROCESS_RESTART_A[@]}" "${PROCESS_RESTART_B[@]}" "${PROCESS_RESTART_C[@]}" "${STATEFUL_SERIAL[@]}"; do
                TEST_PATHS+=(--ignore="$path")
              done
              XDIST_ARGS=(
                -n 2
                --dist=loadscope
              )
              COVERAGE_ARGS=(
                --cov=custom_components.extended_openai_conversation_responses.config_flow
                --cov-branch
                --cov-report=term-missing
                --cov-report=xml:real-ha-config-flow-coverage.xml
                # This shard measures config_flow alone (84.36% baseline). The
                # pyproject 95% floor applies to the complete ordinary unit suite.
                --cov-fail-under=84
              )
              ;;
            *)
              echo "Unknown stable shard: ${{ matrix.shard }}" >&2
              exit 2
              ;;
          esac

          pytest "${TEST_PATHS[@]}" \
            "${XDIST_ARGS[@]}" \
            -v \
            --asyncio-mode=auto \
            --timeout=60 \
            --durations=30 \
            --junitxml="real-ha-junit-${{ matrix.shard }}.xml" \
            "${COVERAGE_ARGS[@]}" \
            2>&1 | tee "real-ha-pytest-${{ matrix.shard }}.log"

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-ha-acceptance-diagnostics-stable-${{ matrix.shard }}
          path: |
            real-ha-pytest-${{ matrix.shard }}.log
            real-ha-junit-${{ matrix.shard }}.xml
            real-ha-config-flow-coverage.xml
          if-no-files-found: warn
          retention-days: 7

  upcoming:
    name: Genuine Home Assistant lifecycle (upcoming)
    runs-on: ubuntu-latest
    needs:
      - classify
      - prepare
    if: needs.classify.outputs.backend == 'true'
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      HA_DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        if: github.event_name != 'schedule'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try prebuilt HA dev environment
        if: github.event_name != 'schedule'
        id: dev-image
        run: |
          if docker pull "$HA_DEV_IMAGE" \
            && python ci/check_ha_dev_image.py \
              "$HA_DEV_IMAGE" "${{ needs.prepare.outputs.ha-core-sha }}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No fresh HA dev image is available; using the current Core commit in the live fallback."
          fi

      - name: Run upcoming acceptance in prebuilt HA dev environment
        if: steps.dev-image.outputs.available == 'true'
        run: |
          docker run --rm \
            --ipc=host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PYTHONPATH=/workspace \
            "$HA_DEV_IMAGE" \
            bash ci/run_prebuilt_ha_dev.sh upcoming

      - name: Set up Python ${{ needs.prepare.outputs.python-version }} for live fallback
        if: steps.dev-image.outputs.available != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Upgrade pip for live fallback
        if: steps.dev-image.outputs.available != 'true'
        run: python -m pip install --upgrade pip

      - name: Install upcoming test requirements without released HA
        if: steps.dev-image.outputs.available != 'true'
        run: |
          grep -v '^pytest-homeassistant-custom-component' requirements_test.txt \
            > "${RUNNER_TEMP}/requirements-real-ha-upcoming.txt"
          pip install -r "${RUNNER_TEMP}/requirements-real-ha-upcoming.txt"

      - name: Cache upcoming Home Assistant Core wheel
        if: steps.dev-image.outputs.available != 'true'
        id: ha-dev-wheel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ha-dev-wheel
          key: ${{ runner.os }}-ha-dev-wheel-${{ needs.prepare.outputs.python-version }}-${{ needs.prepare.outputs.ha-core-sha }}

      - name: Build upcoming Home Assistant Core wheel
        if: steps.dev-image.outputs.available != 'true' && steps.ha-dev-wheel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/ha-dev-wheel"
          pip wheel --no-deps \
            "git+https://github.com/${{ env.HA_CORE_REPO }}.git@${{ needs.prepare.outputs.ha-core-sha }}" \
            --wheel-dir "${RUNNER_TEMP}/ha-dev-wheel"

      - name: Install upcoming Home Assistant Core
        if: steps.dev-image.outputs.available != 'true'
        run: pip install "${RUNNER_TEMP}"/ha-dev-wheel/homeassistant-*.whl

      - name: Install Home Assistant pytest fixture plugin without stable HA
        if: steps.dev-image.outputs.available != 'true'
        run: |
          PLUGIN_SPEC="$(grep '^pytest-homeassistant-custom-component' requirements_test.txt)"
          test -n "$PLUGIN_SPEC"

          pip install --no-deps "$PLUGIN_SPEC"
          python - <<'PY'
          from importlib.metadata import requires
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          from pathlib import Path

          plugin = "pytest-homeassistant-custom-component"
          filtered = []
          for spec in requires(plugin) or []:
              requirement = Requirement(spec)
              if canonicalize_name(requirement.name) == "homeassistant":
                  continue
              if requirement.marker is not None and not requirement.marker.evaluate():
                  continue
              filtered.append(spec)

          path = Path("/tmp/pytest-ha-plugin-deps.txt")
          path.write_text("\n".join(filtered) + "\n", encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY
          pip install -r /tmp/pytest-ha-plugin-deps.txt

      - name: Install integration dependency requirements
        if: steps.dev-image.outputs.available != 'true'
        run: |
          python ci/install_ha_dependencies.py \
            --manifest custom_components/extended_openai_conversation_responses/manifest.json

      - name: Verify live upcoming test environment
        if: steps.dev-image.outputs.available != 'true'
        run: |
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY
          echo "home-assistant-core-sha=${{ needs.prepare.outputs.ha-core-sha }}"

      - name: Run genuine Home Assistant acceptance tests against live fallback
        if: steps.dev-image.outputs.available != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash ci/run_real_ha_upcoming_tests.sh

      - name: Upload acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
