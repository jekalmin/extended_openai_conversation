name: ci

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
  push:
    branches:
      - main
      - develop
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HA_CORE_REPO: "home-assistant/core"
  HA_CORE_BRANCH: "dev"

jobs:
  classify:
    name: Classify PR changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          # Pushes, schedules, and manual runs deliberately keep full coverage.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event: running the full suite." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

          backend=false
          seen=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            seen=true
            case "$path" in
              frontend/*|custom_components/extended_openai_conversation_responses/frontend/*|tests/*.test.mjs|tests_browser/*|playwright*.config.mjs)
                ;;
              *)
                # Fail safe: mixed, backend, dependency, workflow, or unknown
                # changes keep the complete Python/HA checks.
                backend=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files.txt"

          # An unexpected empty diff should never suppress validation.
          if [ "$seen" != "true" ]; then
            backend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          {
            echo "### PR path classification"
            echo
            echo "Backend/HA checks required: `$backend`"
            echo
            echo "Changed files:"
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/changed-files.txt"
          } >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Prepare versions from HA core
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    outputs:
      python-version: ${{ steps.get-versions.outputs.python-version }}
      ha-core-sha: ${{ steps.get-versions.outputs.ha-core-sha }}
      openai-version: ${{ steps.get-versions.outputs.openai-version }}
      hassil-version: ${{ steps.get-versions.outputs.hassil-version }}
      home-assistant-intents-version: ${{ steps.get-versions.outputs.home-assistant-intents-version }}
      xmltodict-version: ${{ steps.get-versions.outputs.xmltodict-version }}
      beautifulsoup4-version: ${{ steps.get-versions.outputs.beautifulsoup4-version }}
      lxml-version: ${{ steps.get-versions.outputs.lxml-version }}
    steps:
      - name: Get versions from Home Assistant core
        id: get-versions
        run: |
          # Function to extract package version from manifest
          get_package_version() {
            local manifest="$1"
            local package="$2"
            echo "$manifest" | grep -o "\"$package==[^\"]*\"" | sed "s/\"$package==//;s/\"//"
          }

          # Resolve one exact HA Core dev snapshot and use it consistently for
          # Python, dependency metadata, and the cached HA-dev wheel.
          HA_CORE_SHA="$(git ls-remote "https://github.com/${{ env.HA_CORE_REPO }}.git" "refs/heads/${{ env.HA_CORE_BRANCH }}" | awk '{print $1}')"
          test -n "$HA_CORE_SHA"
          echo "ha-core-sha=$HA_CORE_SHA" >> $GITHUB_OUTPUT
          echo "Home Assistant Core dev commit: $HA_CORE_SHA"

          PYTHON_VERSION=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/.python-version | tr -d '\n')
          echo "python-version=$PYTHON_VERSION" >> $GITHUB_OUTPUT
          echo "Python version from HA core: $PYTHON_VERSION"

          # Get openai_conversation dependencies
          OPENAI_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/openai_conversation/manifest.json)
          OPENAI_VERSION=$(get_package_version "$OPENAI_MANIFEST" "openai")
          echo "openai-version=$OPENAI_VERSION" >> $GITHUB_OUTPUT
          echo "openai version from HA core: $OPENAI_VERSION"

          # Get conversation dependencies
          CONVERSATION_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/conversation/manifest.json)
          HASSIL_VERSION=$(get_package_version "$CONVERSATION_MANIFEST" "hassil")
          echo "hassil-version=$HASSIL_VERSION" >> $GITHUB_OUTPUT
          echo "hassil version from HA core: $HASSIL_VERSION"

          HA_INTENTS_VERSION=$(get_package_version "$CONVERSATION_MANIFEST" "home-assistant-intents")
          echo "home-assistant-intents-version=$HA_INTENTS_VERSION" >> $GITHUB_OUTPUT
          echo "home-assistant-intents version from HA core: $HA_INTENTS_VERSION"

          # Get rest dependencies
          REST_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/rest/manifest.json)
          XMLTODICT_VERSION=$(get_package_version "$REST_MANIFEST" "xmltodict")
          echo "xmltodict-version=$XMLTODICT_VERSION" >> $GITHUB_OUTPUT
          echo "xmltodict version from HA core: $XMLTODICT_VERSION"

          # Get scrape dependencies
          SCRAPE_MANIFEST=$(curl -fsSL https://raw.githubusercontent.com/${{ env.HA_CORE_REPO }}/$HA_CORE_SHA/homeassistant/components/scrape/manifest.json)
          BS4_VERSION=$(get_package_version "$SCRAPE_MANIFEST" "beautifulsoup4")
          echo "beautifulsoup4-version=$BS4_VERSION" >> $GITHUB_OUTPUT
          echo "beautifulsoup4 version from HA core: $BS4_VERSION"

          LXML_VERSION=$(get_package_version "$SCRAPE_MANIFEST" "lxml")
          echo "lxml-version=$LXML_VERSION" >> $GITHUB_OUTPUT
          echo "lxml version from HA core: $LXML_VERSION"
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.8"

      - name: Run Ruff linter
        run: ruff check custom_components/

      - name: Guard catalogue schema contract
        env:
          CATALOG_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ci/catalog_contract_guard.py

      - name: Run Ruff formatter check
        run: ruff format --check custom_components/

      - name: Check shipped frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend \
            -maxdepth 1 -type f -name '*.js' -print0 \
            | sort -z \
            | xargs -0 -r -n1 node --check

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve Type Check image key
        env:
          PYTHON_VERSION: ${{ needs.prepare.outputs.python-version }}
          OPENAI_VERSION: ${{ needs.prepare.outputs.openai-version }}
          HASSIL_VERSION: ${{ needs.prepare.outputs.hassil-version }}
          HA_INTENTS_VERSION: ${{ needs.prepare.outputs.home-assistant-intents-version }}
          XMLTODICT_VERSION: ${{ needs.prepare.outputs.xmltodict-version }}
          BEAUTIFULSOUP4_VERSION: ${{ needs.prepare.outputs.beautifulsoup4-version }}
          LXML_VERSION: ${{ needs.prepare.outputs.lxml-version }}
        run: |
          KEY="$(python ci/typecheck_image_key.py)"
          echo "TYPECHECK_IMAGE=ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:typecheck-${KEY}" >> "$GITHUB_ENV"
          echo "TYPECHECK_ENV_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try prebuilt Type Check environment
        id: type-image
        run: |
          if docker pull "$TYPECHECK_IMAGE"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Pinned Type Check image is not available yet; using live fallback."
          fi

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        if: steps.type-image.outputs.available != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          cache: pip
          cache-dependency-path: |
            .github/workflows/ci.yml
            custom_components/extended_openai_conversation_responses/manifest.json
            pyproject.toml

      - name: Install live Type Check fallback dependencies
        if: steps.type-image.outputs.available != 'true'
        run: |
          pip install \
            homeassistant \
            "openai==${{ needs.prepare.outputs.openai-version }}" \
            "hassil==${{ needs.prepare.outputs.hassil-version }}" \
            "home-assistant-intents==${{ needs.prepare.outputs.home-assistant-intents-version }}" \
            "xmltodict==${{ needs.prepare.outputs.xmltodict-version }}" \
            "beautifulsoup4==${{ needs.prepare.outputs.beautifulsoup4-version }}" \
            "lxml==${{ needs.prepare.outputs.lxml-version }}" \
            "gazetteer-matcher==1.0.0" \
            "voluptuous-openapi==0.4.1" \
            "httpx>=0.25.0" \
            "types-PyYAML>=6.0" \
            "mypy==2.3.1"
          pip check

      - name: Fingerprint prebuilt Type Check environment
        if: steps.type-image.outputs.available == 'true'
        run: |
          test "$(docker run --rm "$TYPECHECK_IMAGE" cat /opt/eoai-ci/typecheck-image-key)" = "$TYPECHECK_ENV_KEY"
          docker run --rm "$TYPECHECK_IMAGE" cat /opt/eoai-ci/typecheck-environment.txt > .typecheck-environment.txt
          cat .typecheck-environment.txt

      - name: Fingerprint live Type Check fallback environment
        if: steps.type-image.outputs.available != 'true'
        run: |
          python - <<'PY' > .typecheck-environment.txt
          from importlib.metadata import version

          for package in (
              "homeassistant",
              "openai",
              "hassil",
              "home-assistant-intents",
              "xmltodict",
              "beautifulsoup4",
              "lxml",
              "gazetteer-matcher",
              "voluptuous-openapi",
              "httpx",
              "PyYAML",
              "types-PyYAML",
              "mypy",
          ):
              print(f"{package}=={version(package)}")
          PY
          cat .typecheck-environment.txt

      - name: Restore MyPy cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .mypy_cache
          key: ${{ runner.os }}-mypy-${{ needs.prepare.outputs.python-version }}-${{ hashFiles('.typecheck-environment.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-mypy-${{ needs.prepare.outputs.python-version }}-

      - name: Run MyPy in prebuilt Type Check environment
        if: steps.type-image.outputs.available == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$TYPECHECK_IMAGE" \
            mypy custom_components/extended_openai_conversation_responses

      - name: Run MyPy in live fallback
        if: steps.type-image.outputs.available != 'true'
        run: mypy custom_components/extended_openai_conversation_responses

  stable-test:
    name: Test (HA stable)
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.backend == 'true'
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:ha-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconcile current stable test requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            rm -f /opt/eoai-ci/media-dependencies.ready
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py \
              --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Ensure AI Task media dependencies
        run: |
          if [ -f /opt/eoai-ci/media-dependencies.ready ]; then
            echo "AI Task media dependencies are already baked into the stable image."
          else
            echo "Stable image predates baked media dependencies; installing compatibility fallback."
            python ci/install_ha_media_dependencies.py \
              --marker /opt/eoai-ci/media-dependencies.ready
          fi

      - name: Verify stable test environment
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -n 2 \
            --dist=loadscope \
            -v \
            --asyncio-mode=auto \
            --timeout=30 \
            --cov=custom_components/extended_openai_conversation_responses \
            --cov-branch \
            --cov-report=xml \
            --cov-report=term-missing

  dev-test:
    name: Test (HA dev)
    runs-on: ubuntu-latest
    needs: prepare
    env:
      HA_DEV_IMAGE: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-dev:ha-dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Try prebuilt HA dev environment
        id: dev-image
        run: |
          if docker pull "$HA_DEV_IMAGE" \
            && python ci/check_ha_dev_image.py \
              "$HA_DEV_IMAGE" "${{ needs.prepare.outputs.ha-core-sha }}"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No fresh HA dev image is available; using the current Core commit in the live fallback."
          fi

      - name: Run compatibility tests in prebuilt HA dev environment
        if: steps.dev-image.outputs.available == 'true'
        run: |
          docker run --rm \
            --ipc=host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e PYTHONPATH=/workspace \
            "$HA_DEV_IMAGE" \
            bash ci/run_prebuilt_ha_dev.sh compat

      - name: Set up Python ${{ needs.prepare.outputs.python-version }}
        if: steps.dev-image.outputs.available != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ needs.prepare.outputs.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install live fallback dependencies
        if: steps.dev-image.outputs.available != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install \
            "openai==${{ needs.prepare.outputs.openai-version }}" \
            "hassil==${{ needs.prepare.outputs.hassil-version }}" \
            "home-assistant-intents==${{ needs.prepare.outputs.home-assistant-intents-version }}" \
            "xmltodict==${{ needs.prepare.outputs.xmltodict-version }}" \
            "beautifulsoup4==${{ needs.prepare.outputs.beautifulsoup4-version }}" \
            "lxml==${{ needs.prepare.outputs.lxml-version }}"
          grep -v '^pytest-homeassistant-custom-component' requirements_test.txt > "${RUNNER_TEMP}/requirements_test_ha_dev.txt"
          pip install -r "${RUNNER_TEMP}/requirements_test_ha_dev.txt"

      - name: Cache Home Assistant dev wheel for fallback
        if: steps.dev-image.outputs.available != 'true'
        id: ha-dev-wheel-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/ha-dev-wheel
          key: ${{ runner.os }}-ha-dev-wheel-${{ needs.prepare.outputs.python-version }}-${{ needs.prepare.outputs.ha-core-sha }}

      - name: Build Home Assistant dev wheel for fallback
        if: steps.dev-image.outputs.available != 'true' && steps.ha-dev-wheel-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/ha-dev-wheel"
          pip wheel --no-deps \
            "git+https://github.com/${{ env.HA_CORE_REPO }}.git@${{ needs.prepare.outputs.ha-core-sha }}" \
            --wheel-dir "${RUNNER_TEMP}/ha-dev-wheel"

      - name: Install Home Assistant dev fallback
        if: steps.dev-image.outputs.available != 'true'
        run: pip install "${RUNNER_TEMP}"/ha-dev-wheel/homeassistant-*.whl

      - name: Install AI Task media dependencies for fallback
        if: steps.dev-image.outputs.available != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys
          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          requirements = set()
          for domain in ("camera", "stream"):
              manifest = json.loads((components / domain / "manifest.json").read_text())
              requirements.update(manifest.get("requirements", []))
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *sorted(requirements)])
          PY

      - name: Verify live fallback environment
        if: steps.dev-image.outputs.available != 'true'
        run: |
          pip check
          python -c "from importlib.metadata import version; print('homeassistant=' + version('homeassistant'))"
          echo "home-assistant-core-sha=${{ needs.prepare.outputs.ha-core-sha }}"

      - name: Run compatibility tests in live fallback
        if: steps.dev-image.outputs.available != 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash ci/run_ha_dev_compat_tests.sh
