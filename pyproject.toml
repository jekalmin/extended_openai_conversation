[project]
name = "extended_openai_conversation_responses"
description = "Extended OpenAI Conversation (Responses) custom component for Home Assistant"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "mypy",
    "types-PyYAML",
    "pytest",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "pytest-homeassistant-custom-component>=0.13.0",
]

[tool.ruff]
target-version = "py314"
extend-include = ["custom_components/extended_openai_conversation_responses/**/*.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "RUF",    # Ruff-specific rules
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]

ignore = [
    "E501",  # line too long
    "B008",  # function call in argument default (voluptuous pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.extended_openai_conversation_responses", "homeassistant"]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
# Regression guardrail. Stable CI currently measures about 96.6% branch coverage.
# Keep modest headroom for legitimate code growth/refactors while preventing
# material coverage regressions. Raise this floor as the baseline improves.
fail_under = 95

[tool.mutmut]
source_paths = ["custom_components/extended_openai_conversation_responses/"]
only_mutate = [
    "custom_components/extended_openai_conversation_responses/function_call_budget.py",
    "custom_components/extended_openai_conversation_responses/function_tool_resolution.py",
    "custom_components/extended_openai_conversation_responses/function_tool_recovery.py",
    "custom_components/extended_openai_conversation_responses/parallel_tool_execution.py",
]
pytest_add_cli_args_test_selection = [
    "tests/test_native_function_execution_budget.py",
    "tests/test_current_function_tool_fail_closed.py",
    "tests/test_function_tool_error_recovery.py",
    "tests/test_function_tool_recovery_security.py",
    "tests/test_function_tool_recovery_validation_boundary.py",
    "tests/test_parallel_tool_execution.py",
    "tests/test_deterministic_concurrency_cancellation.py",
    "tests/test_targeted_mutation_contracts.py",
]

# Campaigns inherit source_paths from the Function Tool default above.
[tool.mutation-campaigns.function-tools]
# Preserve the original unfiltered run within the four-module allowlist.
# Mutmut 3.7.0 produces no mutants for the decorated FunctionCallBudget class.
selectors = ["*"]
# Cancellation mutants can deadlock an existing test. Let pytest fail that test
# before Mutmut's worker deadline, without accepting incomplete worker results.
pytest_add_cli_args = ["--timeout=10"]

[tool.mutation-campaigns.request-rules]
only_mutate = ["custom_components/extended_openai_conversation_responses/request_rules.py"]
pytest_add_cli_args_test_selection = ["tests/test_request_rule_matching_contracts.py"]
selectors = [
    "custom_components.extended_openai_conversation_responses.request_rules.xǁRequestRulesǁmatch__mutmut_*",
    "custom_components.extended_openai_conversation_responses.request_rules.xǁRequestRulesǁ_sort_and_compile__mutmut_*",
    "custom_components.extended_openai_conversation_responses.request_rules.x__deterministic_match__mutmut_*",
]

[tool.mutation-campaigns.function-groups]
only_mutate = ["custom_components/extended_openai_conversation_responses/function_groups.py"]
pytest_add_cli_args_test_selection = ["tests/test_function_groups_mutation.py"]
selectors = [
    "custom_components.extended_openai_conversation_responses.function_groups.x__available_group_sets__mutmut_*",
    "custom_components.extended_openai_conversation_responses.function_groups.x_assemble_function_tools__mutmut_*",
    "custom_components.extended_openai_conversation_responses.function_groups.x_load_function_groups__mutmut_*",
]

[tool.mutation-campaigns.guest-security]
only_mutate = ["custom_components/extended_openai_conversation_responses/guest_mode.py"]
pytest_add_cli_args_test_selection = ["tests/test_guest_mode.py"]
selectors = ["*guest_mode.x_resolve_guest_policy__mutmut_*"]

[tool.mutation-campaigns.ha-permissions]
only_mutate = ["custom_components/extended_openai_conversation_responses/ha_permissions.py"]
pytest_add_cli_args_test_selection = ["tests/test_ha_permissions_mutation.py"]
selectors = [
    "*ha_permissions.x_filter_entities_for_active_user__mutmut_*",
    "*ha_permissions.x_async_require_control_permission__mutmut_*",
]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
files = ["custom_components/extended_openai_conversation_responses/**/*.py"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "extended_openai_conversation_responses.debug"
disable_error_code = ["method-assign"]
