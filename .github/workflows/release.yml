name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Validate target release version
        id: version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION="$(python scripts/set_release_version.py --check)"
          python - "$CURRENT_VERSION" "$TARGET_VERSION" <<'PY'
          import re
          import sys

          current, target = sys.argv[1:3]
          pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          if not pattern.fullmatch(target):
              raise SystemExit(f"Release version must use X.Y.Z format, got {target!r}")
          if not pattern.fullmatch(current):
              raise SystemExit(f"Current tracked version is not X.Y.Z: {current!r}")
          if target != current:
              raise SystemExit(
                  f"Release version {target} must already be tracked in source "
                  f"commit {current}. Commit the version bump to develop and "
                  "certify that exact commit before publishing."
              )
          PY
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$TARGET_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release does not already exist
        id: release_guard
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists"
            exit 1
          fi

          LATEST_RELEASE="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          echo "latest_release=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ -n "$LATEST_RELEASE" ]]; then
            python - "$LATEST_RELEASE" "$CURRENT_VERSION" "$VERSION" <<'PY'
          import re
          import sys

          latest, current, target = sys.argv[1:4]
          pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          for label, value in (("latest release", latest), ("tracked version", current), ("target", target)):
              if not pattern.fullmatch(value):
                  raise SystemExit(f"{label} is not X.Y.Z: {value!r}")
          key = lambda value: tuple(map(int, value.split(".")))
          if key(current) < key(latest):
              raise SystemExit(
                  f"Tracked version {current} is older than latest published release {latest}"
              )
          if key(target) <= key(latest):
              raise SystemExit(
                  f"Release version {target} must be newer than latest published release {latest}"
              )
          PY
          fi

      - name: Capture checked-out source commit
        id: source
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          test "$SOURCE_SHA" = "${{ github.sha }}"
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify exact-source certification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          python ci/release_certification.py \
            --repository "${{ github.repository }}" --sha "$SOURCE_SHA"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Install Firefox and WebKit
        run: npx playwright install --with-deps firefox webkit

      - name: Verify Firefox and WebKit critical browser paths
        run: npx playwright test --config=playwright.cross-browser-smoke.config.mjs

      - name: Install stable Home Assistant test harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt
          pip install homeassistant

      - name: Install integration dependency requirements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          import homeassistant

          components = Path(next(iter(homeassistant.__path__))) / "components"
          custom_manifest = json.loads(
              Path(
                  "custom_components/extended_openai_conversation_responses/manifest.json"
              ).read_text()
          )

          requirements = set(custom_manifest.get("requirements", []))
          pending = [
              *custom_manifest.get("dependencies", []),
              *custom_manifest.get("after_dependencies", []),
          ]
          visited = set()

          while pending:
              domain = pending.pop()
              if domain in visited:
                  continue
              visited.add(domain)

              manifest_path = components / domain / "manifest.json"
              if not manifest_path.exists():
                  raise RuntimeError(
                      f"Home Assistant dependency manifest not found: {domain}"
                  )

              manifest = json.loads(manifest_path.read_text())
              requirements.update(manifest.get("requirements", []))
              pending.extend(manifest.get("dependencies", []))
              pending.extend(manifest.get("after_dependencies", []))

          # Home Assistant imports these entity integrations while setting up the
          # declared dependency graph, but they are not themselves reachable via
          # manifest dependencies. The child process must still have their Python
          # requirements because it intentionally exercises a real clean HA boot.
          for domain in ("infrared", "radio_frequency"):
              manifest_path = components / domain / "manifest.json"
              manifest = json.loads(manifest_path.read_text())
              requirements.update(manifest.get("requirements", []))

          if requirements:
              subprocess.check_call(
                  [sys.executable, "-m", "pip", "install", *sorted(requirements)]
              )
          PY

      - name: Build staged tracked release payload
        id: payload
        run: |
          PAYLOAD_ROOT="${RUNNER_TEMP}/release-payload"
          rm -rf "$PAYLOAD_ROOT"
          mkdir -p "$PAYLOAD_ROOT"
          while IFS= read -r -d '' file; do
            mkdir -p "$PAYLOAD_ROOT/$(dirname "$file")"
            cp "$file" "$PAYLOAD_ROOT/$file"
          done < <(git ls-files -z custom_components/extended_openai_conversation_responses)
          echo "root=$PAYLOAD_ROOT" >> "$GITHUB_OUTPUT"

      - name: Stage latest published release for upgrade acceptance
        id: previous_release
        env:
          LATEST_RELEASE: ${{ steps.release_guard.outputs.latest_release }}
        run: |
          set -euo pipefail
          if [[ -z "$LATEST_RELEASE" ]]; then
            echo "has_previous=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/${LATEST_RELEASE}^{commit}" >/dev/null
          PREVIOUS_ROOT="${RUNNER_TEMP}/previous-release"
          rm -rf "$PREVIOUS_ROOT"
          mkdir -p "$PREVIOUS_ROOT"
          git archive "$LATEST_RELEASE" \
            custom_components/extended_openai_conversation_responses \
            | tar -x -C "$PREVIOUS_ROOT"

          PREVIOUS_COMPONENT="$PREVIOUS_ROOT/custom_components/extended_openai_conversation_responses"
          PREVIOUS_MANIFEST_VERSION="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$PREVIOUS_COMPONENT/manifest.json")"
          if [[ "$PREVIOUS_MANIFEST_VERSION" != "$LATEST_RELEASE" ]]; then
            echo "Latest release tag $LATEST_RELEASE contains manifest version $PREVIOUS_MANIFEST_VERSION"
            exit 1
          fi

          echo "has_previous=true" >> "$GITHUB_OUTPUT"
          echo "version=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "component=$PREVIOUS_COMPONENT" >> "$GITHUB_OUTPUT"

      - name: Install requirements for previous and candidate payloads
        if: steps.previous_release.outputs.has_previous == 'true'
        env:
          FROM_COMPONENT: ${{ steps.previous_release.outputs.component }}
          TO_COMPONENT: ${{ steps.payload.outputs.root }}/custom_components/extended_openai_conversation_responses
        run: |
          python scripts/upgrade_acceptance_requirements.py \
            "$FROM_COMPONENT" "$TO_COMPONENT" \
            > "${RUNNER_TEMP}/upgrade-requirements.txt"
          if [[ -s "${RUNNER_TEMP}/upgrade-requirements.txt" ]]; then
            python -m pip install -r "${RUNNER_TEMP}/upgrade-requirements.txt"
          fi

      - name: Verify latest published release upgrades to staged candidate
        if: steps.previous_release.outputs.has_previous == 'true'
        env:
          UPGRADE_FROM_COMPONENT_DIR: ${{ steps.previous_release.outputs.component }}
          UPGRADE_TO_COMPONENT_DIR: ${{ steps.payload.outputs.root }}/custom_components/extended_openai_conversation_responses
          UPGRADE_FROM_VERSION: ${{ steps.previous_release.outputs.version }}
          UPGRADE_TO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pytest \
            tests_real_ha/test_release_upgrade_acceptance.py \
            tests_real_ha/test_release_upgrade_custom_function_tool.py \
            -v \
            --asyncio-mode=auto \
            --timeout=300

      - name: Verify clean packaged install and cold restart
        env:
          RELEASE_COMPONENT_DIR: ${{ steps.payload.outputs.root }}/custom_components/extended_openai_conversation_responses
          RELEASE_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pytest \
            tests_real_ha/test_packaged_release.py \
            tests_real_ha/test_packaged_process_restart.py \
            -v \
            --asyncio-mode=auto \
            --timeout=210

      - name: Refuse to publish from stale develop
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          git fetch origin develop
          DEVELOP_SHA="$(git rev-parse origin/develop)"
          if [[ "$DEVELOP_SHA" != "$SOURCE_SHA" ]]; then
            echo "develop moved from $SOURCE_SHA to $DEVELOP_SHA while the release was being prepared"
            echo "No version bump or release has been published. Re-run from current develop."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          gh release create "$VERSION" \
            --target "$RELEASE_SHA" \
            --title "$VERSION" \
            --generate-notes
