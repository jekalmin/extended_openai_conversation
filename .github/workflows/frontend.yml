name: Frontend

on:
  pull_request:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify frontend contract changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Classify PR dependency changes
        id: changes
        shell: bash
        run: |
          python -m unittest ci.test_classify_frontend_changes ci.test_route_acceptance -v
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/frontend-changed-files.txt"
            python ci/classify_frontend_changes.py "$RUNNER_TEMP/frontend-changed-files.txt" --output "$GITHUB_OUTPUT"
          fi
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Check shipped frontend modules
        run: |
          find custom_components/extended_openai_conversation_responses/frontend \
            -maxdepth 1 -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          node scripts/run-frontend-standalone-tests.mjs

      - name: Type check
        working-directory: frontend
        run: npm run check

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build

      - name: Check production bundle regression ceilings
        run: python ci/check_frontend_bundle.py

      - name: Commit generated bundle to PR branch
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- custom_components/extended_openai_conversation_responses/frontend/dist/; then
            exit 0
          fi
          rm -rf /tmp/extended-openai-dist
          cp -a custom_components/extended_openai_conversation_responses/frontend/dist /tmp/extended-openai-dist
          git fetch origin nightly/pr12-function-validation-recovery
          git reset --hard origin/nightly/pr12-function-validation-recovery
          rm -rf custom_components/extended_openai_conversation_responses/frontend/dist
          cp -a /tmp/extended-openai-dist custom_components/extended_openai_conversation_responses/frontend/dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/extended_openai_conversation_responses/frontend/dist/
          git commit -m "Rebuild frontend bundle"
          git push origin HEAD:nightly/pr12-function-validation-recovery

      - name: Verify tracked production frontend bundle
        run: git diff --exit-code -- custom_components/extended_openai_conversation_responses/frontend/dist/

      - name: Upload production frontend bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-frontend-bundle
          path: custom_components/extended_openai_conversation_responses/frontend/dist/
          if-no-files-found: error
          retention-days: 7

  browser-smoke:
    name: Browser smoke (Chromium / ${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-1.63.0

      - name: Install Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run shipped frontend browser smoke tests
        env:
          PLAYWRIGHT_WORKERS: "2"
        run: >-
          npx playwright test
          --config=playwright.config.mjs
          --shard=${{ matrix.shard }}/3

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-browser-diagnostics-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  browser-real-ha:
    name: Browser to genuine HA backend (Chromium / ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: management-shell-refresh
            test-paths: >-
              tests_real_ha/test_browser_backend_acceptance.py
              tests_real_ha/test_browser_refresh_boundary_acceptance.py
          - shard: process-restart-runtime
            test-paths: >-
              tests_real_ha/test_browser_process_restart_acceptance.py
              tests_real_ha/test_browser_runtime_acceptance.py
    container:
      image: ghcr.io/${{ github.repository_owner }}/extended-openai-ci-stable:browser-stable
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconcile current Home Assistant requirements
        run: |
          CURRENT_ENVIRONMENT_SHA="$(cat requirements_test.txt custom_components/extended_openai_conversation_responses/manifest.json | sha256sum | awk '{print $1}')"
          BUILT_ENVIRONMENT_SHA="$(cat /opt/eoai-ci/environment.sha256)"
          if [ "$CURRENT_ENVIRONMENT_SHA" = "$BUILT_ENVIRONMENT_SHA" ]; then
            echo "Prebuilt dependency environment matches this checkout; skipping reconciliation."
          else
            echo "Dependency declarations changed; reconciling prebuilt environment."
            pip install -r requirements_test.txt
            pip install --upgrade homeassistant
            python ci/install_ha_dependencies.py \
              --manifest custom_components/extended_openai_conversation_responses/manifest.json
          fi

      - name: Verify prebuilt browser environment
        run: |
          pip check
          python - <<'PY'
          from importlib.metadata import version
          print("homeassistant=" + version("homeassistant"))
          print("pytest-homeassistant-custom-component=" + version("pytest-homeassistant-custom-component"))
          PY
          node --version
          npx playwright --version

      - name: Install local Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Run browser against genuine HA management backend, frontend shell, and live runtime
        env:
          RUN_REAL_HA_BROWSER: "1"
        run: |
          pytest ${{ matrix.test-paths }} \
            -v \
            --asyncio-mode=auto \
            --timeout=600 \
            --durations=30

      - name: Upload genuine HA browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-real-ha-browser-diagnostics-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
