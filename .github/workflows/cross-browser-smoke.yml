name: Cross-browser smoke

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - develop
  pull_request:

concurrency:
  group: cross-browser-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    name: Classify frontend contract changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Classify PR dependency changes
        id: changes
        shell: bash
        run: |
          python -m unittest ci.test_classify_frontend_changes -v
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            git diff --no-renames --name-only \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" > "$RUNNER_TEMP/frontend-changed-files.txt"
            python ci/classify_frontend_changes.py "$RUNNER_TEMP/frontend-changed-files.txt" --output "$GITHUB_OUTPUT"
          fi
  smoke:
    name: Shipped bundle critical paths (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.63.0

      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run critical functional smoke journeys
        env:
          SHIPPED_BUNDLE: "1"
        run: npx playwright test --config=playwright.cross-browser-smoke.config.mjs

      - name: Upload cross-browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cross-browser-smoke-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
